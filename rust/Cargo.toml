[package]
name = "mandrake"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bzip2 = "0.4"
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
env_logger = "0.11"
hashbrown = "0.14"
indicatif = "0.17"
log = "0.4"
ndarray = "0.16"
needletail = { version = "0.5", features = ["compression"] }
rayon = "1.10"
rand_xoshiro = "0.6"
roaring = "0.10"
sketchlib = "0.4.1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "mandrake"
path = "src/main.rs"
